use_default_settings:
  engines:
    remove:
      # These engines produced almost all local noise: CAPTCHA, rate limits, and
      # slow timeout reports under agent-style query volume.
      - duckduckgo
      - duckduckgo web
      - duckduckgo images
      - duckduckgo videos
      - duckduckgo news
      - duckduckgo weather
      - startpage
      - startpage news
      - startpage images
      - wikipedia
      - wikidata
      - brave
      - brave.images
      - brave.videos
      - brave.news
      - qwant
      - qwant news
      - qwant images
      - qwant videos
      - yep

general:
  debug: false
  instance_name: "Local Agent Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "DgGx1bBd3tOoYnSV94sjclmTHwrhqZ08IMLzPvR67pfiUykNCE5uFXea2KWQAJ"
  limiter: false
  image_proxy: true
  method: "GET"

redis:
  url: redis://redis:6379/0

ui:
  static_use_hash: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 25
  pool_maxsize: 8

engines:
  # Curated general-search pool. The MCP wrapper also passes this list
  # explicitly for normal web_search calls so one query does not fan out across
  # every default SearXNG engine.
  - name: bing
    disabled: false
    categories: [general, web]
    timeout: 10.0

  - name: google
    categories: [general, web]
    timeout: 10.0

  - name: mojeek
    disabled: false
    categories: [general, web]
    timeout: 10.0

  - name: presearch
    disabled: false
    categories: [general, web]
    timeout: 10.0
