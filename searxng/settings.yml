use_default_settings:
  engines:
    remove:
      # These engines produced almost all local noise: CAPTCHA, rate limits, and
      # slow timeout reports under agent-style query volume.
      - duckduckgo images
      - duckduckgo videos
      - duckduckgo news
      - duckduckgo weather
      - startpage
      - startpage news
      - startpage images
      - wikipedia
      - wikidata
      - brave
      - brave.images
      - brave.videos
      - brave.news
      - qwant
      - qwant news
      - qwant images
      - qwant videos
      - yep
      # Dark-web engines are not part of this local general-search stack and
      # currently fail initialization in the upstream image.
      - ahmia
      - torch

general:
  debug: false
  instance_name: "Local Agent Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "DgGx1bBd3tOoYnSV94sjclmTHwrhqZ08IMLzPvR67pfiUykNCE5uFXea2KWQAJ"
  limiter: false
  image_proxy: true
  method: "GET"

valkey:
  url: redis://redis:6379/0

ui:
  static_use_hash: true

outgoing:
  # 3.0s per engine was not a safety margin but a throughput cap: mojeek
  # returned ~2.5 results per query at 3.0s against a full 10 at 10s.
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 16
  proxies:
    all://:
      - socks5h://byedpi:1080

engines:
  # Curated general-search pool. Only engines measured to answer the actual
  # query from this network are enabled; the rest stay loaded but out of the
  # default pool, so `engines=<name>` can still reach them for re-measurement.
  #
  # bing: serves an anti-scraping placeholder SERP to non-browser clients -
  # a well-formed page whose organic block answers the FIRST QUERY TERM only.
  # Measured over 8 technical queries: 75% of results contain some query token,
  # but only 12% contain any token past the first. Reproduced without byedpi,
  # on single sequential requests, across five header profiles; the same URL
  # through crawl4ai's real Chrome from the same egress IP returns correct
  # results, so this is client-signature based and nothing in this file fixes
  # it. duckduckgo below rides the same Bing index without the anti-bot.
  - name: bing
    disabled: true
    categories: [general, web]
    timeout: 6.0

  # brave: replies 429 with SearxEngineTooManyRequestsException
  # (suspended_time=180) on essentially every query.
  - name: brave
    engine: brave
    disabled: true
    categories: [general, web]
    timeout: 6.0

  # google: answers 200 with a ~90KB JS shell (no data-ved, no jscontroller),
  # so the parser extracts nothing and the engine fails silently - no error, no
  # unresponsive_engines entry, just a spent slice of the request budget.
  - name: google
    disabled: true
    categories: [general, web]
    timeout: 6.0

  # duckduckgo: rides the Bing index without Bing's anti-bot, and answers the
  # full query correctly when it answers at all - but it hard-CAPTCHAs under
  # agent-rate load. Measured: 20 results over 3 spaced queries on a cold
  # engine, then 0 over 8 consecutive queries, and still 0 with 20s spacing.
  - name: duckduckgo
    disabled: true
    categories: [general, web]
    timeout: 6.0

  # mwmbl: small independent index, so it contributes few results, but they are
  # on-topic and it is the only engine here not derived from Bing or Yandex.
  - name: mwmbl
    disabled: false
    categories: [general, web]
    timeout: 6.0

  - name: mojeek
    disabled: false
    categories: [general, web]
    timeout: 6.0

  - name: presearch
    disabled: true
    categories: [general, web]
    timeout: 6.0

  - name: yandex
    disabled: false
    categories: [general, web]
    timeout: 6.0
