use_default_settings:
  engines:
    remove:
      # These engines produced almost all local noise: CAPTCHA, rate limits, and
      # slow timeout reports under agent-style query volume.
      - duckduckgo
      - duckduckgo web
      - duckduckgo images
      - duckduckgo videos
      - duckduckgo news
      - duckduckgo weather
      - startpage
      - startpage news
      - startpage images
      - wikipedia
      - wikidata
      - brave
      - brave.images
      - brave.videos
      - brave.news
      - qwant
      - qwant news
      - qwant images
      - qwant videos
      - yep
      # Dark-web engines are not part of this local general-search stack and
      # currently fail initialization in the upstream image.
      - ahmia
      - torch

general:
  debug: false
  instance_name: "Local Agent Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "DgGx1bBd3tOoYnSV94sjclmTHwrhqZ08IMLzPvR67pfiUykNCE5uFXea2KWQAJ"
  limiter: false
  image_proxy: true
  method: "GET"

valkey:
  url: redis://redis:6379/0

ui:
  static_use_hash: true

outgoing:
  request_timeout: 4.5
  max_request_timeout: 7.0
  pool_connections: 50
  pool_maxsize: 16
  proxies:
    all://:
      - socks5h://byedpi:1080

engines:
  # Curated general-search pool. Lower timeouts prevent any single engine from blocking searches.
  - name: bing
    disabled: false
    categories: [general, web]
    timeout: 3.0

  - name: brave
    engine: brave
    disabled: false
    categories: [general, web]
    timeout: 3.0

  - name: google
    categories: [general, web]
    timeout: 3.0

  - name: mojeek
    disabled: false
    categories: [general, web]
    timeout: 3.0

  - name: presearch
    disabled: true
    categories: [general, web]
    timeout: 3.0

  - name: yandex
    disabled: false
    categories: [general, web]
    timeout: 3.0
