[project]
name = "local-web-stack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "crawl4ai>=0.9.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
]

[dependency-groups]
dev = [
  "ruff>=0.12",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6",
  "pre-commit>=4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["work", "kanban"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["service", "mcp/local_web_mcp.py", "mcp/mcp_tools.py", "scripts/quality"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["service", "mcp"]
omit = ["service/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
