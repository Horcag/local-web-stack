name: local-web-stack

services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: local-web-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data

  byedpi:
    build:
      context: .
      dockerfile: Dockerfile.byedpi
    container_name: local-web-byedpi
    restart: unless-stopped
    command: --ip 0.0.0.0 --port 1080 --auto=torst -s 1+s

  searxng:
    image: searxng/searxng:latest
    container_name: local-web-searxng
    restart: unless-stopped
    depends_on:
      - redis
      - byedpi
    ports:
      # 8088 sits inside a WinNAT dynamic exclusion range (8046-8145) on this
      # host, so Docker cannot bind it. Revert to 8088 once the port is
      # permanently reserved: netsh int ipv4 add excludedportrange
      # protocol=tcp startport=8088 numberofports=1 store=persistent
      - "127.0.0.1:8188:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8188/"
      UWSGI_WORKERS: "4"
      UWSGI_THREADS: "4"
    volumes:
      - ./searxng:/etc/searxng:rw

  crawl4ai:
    build: .
    container_name: local-web-crawl4ai
    # tini as PID 1: uvicorn does not reap orphaned Chrome children, and the
    # zombies pile up until the container runs out of PID slots.
    init: true
    restart: unless-stopped
    depends_on:
      - byedpi
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      CRAWL4AI_DEFAULT_PROXY: "socks5://byedpi:1080"
      CRAWL4AI_CACHE_MODE: "enabled"
      CRAWL4AI_PERSISTENT_CONTEXT: "true"
      CRAWL4AI_USER_DATA_DIR: "/app/work/browser-profile"
      CRAWL4AI_SERIALIZE_REQUESTS: "true"
      CRAWL4AI_PAGE_TIMEOUT_MS: "60000"
      CRAWL4AI_WAIT_UNTIL: "domcontentloaded"
      # crawl4ai's overlay heuristic strips any element it reads as a modal.
      # On some layouts (tomshardware.com) that is the article container
      # itself, and the crawl returns an empty body with a valid title, which
      # looks exactly like a bot block. Consent-popup removal stays on; it
      # targets banners specifically instead of guessing.
      CRAWL4AI_REMOVE_OVERLAYS: "false"
      # Stealth profile follows Patchright's documented best practice:
      # real Chrome, persistent context, headed (under Xvfb), no viewport
      # override, and no fingerprint injection of any kind.
      CRAWL4AI_BROWSER_TYPE: "undetected"
      CRAWL4AI_CHROME_CHANNEL: "chrome"
      CRAWL4AI_HEADLESS: "false"
      CRAWL4AI_NO_VIEWPORT: "true"
      CRAWL4AI_ENABLE_STEALTH: "true"
      # Empty/false on purpose: each of these injects a fingerprint that
      # contradicts the real Chrome profile. crawl4ai routes magic and
      # simulate_user through the same add_init_script(navigator_overrider)
      # that Patchright explicitly warns against.
      CRAWL4AI_ACCEPT_LANGUAGE: ""
      CRAWL4AI_USER_AGENT_MODE: ""
      CRAWL4AI_MAGIC: "false"
      CRAWL4AI_SIMULATE_USER: "false"
      CRAWL4AI_OVERRIDE_NAVIGATOR: "false"
      CRAWL4AI_DELAY_BEFORE_RETURN_HTML: "2.5"
      CRAWL4AI_MEAN_DELAY: "1.0"
      CRAWL4AI_MAX_DELAY_RANGE: "1.5"
      CRAWL4AI_DOMAIN_DELAY_SECONDS: "3.0"
    volumes:
      - ./work/crawl4ai:/app/work

  mcp:
    build: .
    container_name: local-web-mcp
    restart: unless-stopped
    depends_on:
      - searxng
      - crawl4ai
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SEARXNG_URL: "http://local-web-searxng:8080"
      CRAWL4AI_URL: "http://local-web-crawl4ai:11235"
      LOCAL_WEB_MCP_TRANSPORT: "streamable-http"
      LOCAL_WEB_MCP_HOST: "0.0.0.0"
      LOCAL_WEB_MCP_PORT: "8765"
    command: .venv/bin/python mcp/local_web_mcp.py

volumes:
  valkey-data:
