name: local-web-stack

# Do not inherit a WSL-only resolver that Docker cannot forward to after reboot.
# Docker's embedded resolver still handles service names on the Compose network.
x-external-dns: &external-dns
  - "${LOCAL_WEB_DNS_PRIMARY:-1.1.1.1}"
  - "${LOCAL_WEB_DNS_SECONDARY:-8.8.8.8}"

services:
  browser-relay:
    image: "${LOCAL_WEB_GATEWAY_RELAY_IMAGE:-local-web-stack-crawl4ai}"
    profiles: [browser-gateway]
    container_name: local-web-browser-relay
    user: "${LOCAL_WEB_BROWSER_RELAY_UID:-1000}:${LOCAL_WEB_BROWSER_RELAY_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      LOCAL_WEB_GATEWAY_RELAY_BIND_HOST: container
      LOCAL_WEB_GATEWAY_RELAY_BIND_PORT: "19226"
      LOCAL_WEB_GATEWAY_RELAY_TARGET_UNIX_PATH: /run/browser-gateway.sock
    volumes:
      - type: bind
        source: "${LOCAL_WEB_BROWSER_RELAY_SOCKET:-/run/local-web/browser-gateway.sock}"
        target: /run/browser-gateway.sock
        read_only: true
        bind:
          create_host_path: false
    command: .venv/bin/python -m service.gateway_relay

  gateway-relay:
    image: "${LOCAL_WEB_GATEWAY_RELAY_IMAGE:-local-web-stack-crawl4ai}"
    profiles: [captcha-gateway]
    container_name: local-web-gateway-relay
    user: "${LOCAL_WEB_GATEWAY_RELAY_UID:-1000}:${LOCAL_WEB_GATEWAY_RELAY_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      LOCAL_WEB_GATEWAY_RELAY_BIND_HOST: "${LOCAL_WEB_GATEWAY_RELAY_BIND_HOST:-}"
      LOCAL_WEB_GATEWAY_RELAY_BIND_PORT: "${LOCAL_WEB_GATEWAY_RELAY_BIND_PORT:-18045}"
      LOCAL_WEB_GATEWAY_RELAY_TARGET_HOST: "${LOCAL_WEB_GATEWAY_RELAY_TARGET_HOST:-127.0.0.1}"
      LOCAL_WEB_GATEWAY_RELAY_TARGET_PORT: "${LOCAL_WEB_GATEWAY_RELAY_TARGET_PORT:-8045}"
      LOCAL_WEB_GATEWAY_RELAY_TARGET_UNIX_PATH: /run/model-gateway.sock
    volumes:
      - type: bind
        source: "${LOCAL_WEB_GATEWAY_RELAY_SOCKET:-/run/local-web/model-gateway.sock}"
        target: /run/model-gateway.sock
        read_only: true
        bind:
          create_host_path: false
    command: .venv/bin/python -m service.gateway_relay

  redis:
    image: valkey/valkey:8-alpine
    container_name: local-web-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - valkey-data:/data

  byedpi:
    dns: *external-dns
    build:
      context: .
      dockerfile: Dockerfile.byedpi
    container_name: local-web-byedpi
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'nslookup example.com >/dev/null && nc -z -w 3 127.0.0.1 1080']
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    command: --ip 0.0.0.0 --port 1080 --auto=torst -s 1+s

  searxng:
    dns: *external-dns
    image: searxng/searxng:2026.8.4-c63835bd2
    container_name: local-web-searxng
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      byedpi:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/searxng/.venv/bin/python, -c, 'import socket, urllib.request; socket.getaddrinfo("example.com", 443); urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=4).close()']
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    ports:
      # On Windows hosts WinNAT re-rolls its dynamic TCP exclusion ranges at
      # boot and can swallow this port, after which Docker fails to bind with
      # "socket ... forbidden by its access permissions". Reserve it once from
      # an elevated shell to make it stick:
      #   netsh int ipv4 add excludedportrange protocol=tcp \
      #     startport=8088 numberofports=1 store=persistent
      # If the port is already inside a live range, netsh refuses until WinNAT
      # releases it: net stop winnat, add the exclusion, net start winnat.
      - "127.0.0.1:8088:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8088/"
      UWSGI_WORKERS: "4"
      UWSGI_THREADS: "4"
    volumes:
      - ./searxng:/etc/searxng:rw

  crawl4ai:
    dns: *external-dns
    build: .
    container_name: local-web-crawl4ai
    # tini as PID 1: uvicorn does not reap orphaned Chrome children, and the
    # zombies pile up until the container runs out of PID slots.
    init: true
    restart: unless-stopped
    depends_on:
      byedpi:
        condition: service_healthy
    healthcheck:
      test: [CMD, .venv/bin/python, -m, service.healthcheck, crawl4ai]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      SEARXNG_URL: "http://local-web-searxng:8080"
      LOCAL_WEB_RESEARCH_DB: "/app/work/research.sqlite3"
      LOCAL_WEB_BROWSER_CDP_URL: "${LOCAL_WEB_BROWSER_CDP_URL:-}"
      LOCAL_WEB_BROWSER_CDP_HOST_HEADER: "${LOCAL_WEB_BROWSER_CDP_HOST_HEADER:-}"
      CRAWL4AI_DEFAULT_PROXY: "socks5://byedpi:1080"
      CRAWL4AI_CACHE_MODE: "enabled"
      CRAWL4AI_PERSISTENT_CONTEXT: "true"
      CRAWL4AI_USER_DATA_DIR: "/app/work/browser-profile"
      CRAWL4AI_SERIALIZE_REQUESTS: "true"
      LOCAL_WEB_CRAWL_CANARY_ENABLED: "true"
      LOCAL_WEB_CRAWL_CANARY_URL: "http://crawl4ai:11235/health/canary"
      LOCAL_WEB_CRAWL_TIMEOUT_SECONDS: "75"
      CRAWL4AI_PAGE_TIMEOUT_MS: "60000"
      CRAWL4AI_WAIT_UNTIL: "domcontentloaded"
      # crawl4ai's overlay heuristic strips any element it reads as a modal.
      # On some layouts (tomshardware.com) that is the article container
      # itself, and the crawl returns an empty body with a valid title, which
      # looks exactly like a bot block. Consent-popup removal stays on; it
      # targets banners specifically instead of guessing.
      CRAWL4AI_REMOVE_OVERLAYS: "false"
      # Stealth profile follows Patchright's documented best practice:
      # real Chrome, persistent context, headed (under Xvfb), no viewport
      # override, and no fingerprint injection of any kind.
      CRAWL4AI_BROWSER_TYPE: "undetected"
      CRAWL4AI_CHROME_CHANNEL: "chrome"
      CRAWL4AI_HEADLESS: "false"
      CRAWL4AI_NO_VIEWPORT: "true"
      CRAWL4AI_ENABLE_STEALTH: "true"
      # Empty/false on purpose: each of these injects a fingerprint that
      # contradicts the real Chrome profile. crawl4ai routes magic and
      # simulate_user through the same add_init_script(navigator_overrider)
      # that Patchright explicitly warns against.
      CRAWL4AI_ACCEPT_LANGUAGE: ""
      CRAWL4AI_USER_AGENT_MODE: ""
      CRAWL4AI_MAGIC: "false"
      CRAWL4AI_SIMULATE_USER: "false"
      CRAWL4AI_OVERRIDE_NAVIGATOR: "false"
      LOCAL_WEB_CAPTCHA_ENABLED: "${LOCAL_WEB_CAPTCHA_ENABLED:-false}"
      LOCAL_WEB_CAPTCHA_BASE_URL: "${LOCAL_WEB_CAPTCHA_BASE_URL:-}"
      LOCAL_WEB_CAPTCHA_API_KEY: "${LOCAL_WEB_CAPTCHA_API_KEY:-}"
      LOCAL_WEB_CAPTCHA_MODEL: "${LOCAL_WEB_CAPTCHA_MODEL:-gemini-3.8-flash-high}"
      LOCAL_WEB_CAPTCHA_TIMEOUT_SECONDS: "${LOCAL_WEB_CAPTCHA_TIMEOUT_SECONDS:-15}"
      CRAWL4AI_DELAY_BEFORE_RETURN_HTML: "2.5"
      CRAWL4AI_MEAN_DELAY: "1.0"
      CRAWL4AI_MAX_DELAY_RANGE: "1.5"
      CRAWL4AI_DOMAIN_DELAY_SECONDS: "3.0"
    volumes:
      - ./work/crawl4ai:/app/work

  mcp:
    build: .
    container_name: local-web-mcp
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    healthcheck:
      test: [CMD, .venv/bin/python, -m, service.healthcheck, mcp]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SEARXNG_URL: "http://local-web-searxng:8080"
      CRAWL4AI_URL: "http://local-web-crawl4ai:11235"
      LOCAL_WEB_MCP_TRANSPORT: "streamable-http"
      LOCAL_WEB_MCP_HOST: "0.0.0.0"
      LOCAL_WEB_MCP_PORT: "8765"
    command: .venv/bin/python mcp/local_web_mcp.py

volumes:
  valkey-data:
