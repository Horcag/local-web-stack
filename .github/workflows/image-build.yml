name: Build and verify image
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.13'
      - run: uv sync --frozen --group dev
      - name: Verify publication revision
        env:
          UV_OFFLINE: '1'
        run: uv run --frozen python scripts/quality/check.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: local-web:smoke
          platforms: linux/amd64
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Exercise packaged routes and real bundled Chromium
        run: >-
          docker run --rm
          --mount type=bind,source="$PWD/scripts/quality/image_smoke.py",target=/tmp/image_smoke.py,readonly
          --env PYTHONPATH=/app
          --entrypoint .venv/bin/python local-web:smoke /tmp/image_smoke.py
      - name: Publish the smoke-tested image
        if: inputs.publish
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          docker tag local-web:smoke "$IMAGE_NAME:sha-$REVISION"
          docker push "$IMAGE_NAME:sha-$REVISION"
